[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronopy"
version = "0.1.0"
description = "A time-travel debugger for Python — record, rewind, and query any program's execution."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.24",
    "msgpack>=1.0",
    "orjson>=3.9",
    "websockets>=12.0",
    "rich>=13.0",
    "click>=8.1",
]

[project.scripts]
chronopy = "chronopy.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["chronopy*"]

[tool.setuptools.package-data]
"chronopy.ui" = ["*.html", "*.js", "*.css"]
